<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#244e3b" />
    <meta
      name="description"
      content="Watch the Crops launch trailer: free, open source time tracking for teams and their agents."
    />
    <meta property="og:title" content="Crops launch trailer" />
    <meta property="og:type" content="video.other" />
    <meta property="og:image" content="/trailer/poster.jpg" />
    <meta property="og:video" content="/trailer/crops-launch.mp4" />
    <link rel="icon" type="image/svg+xml" href="/crops.svg" />
    <title>Trailer · Crops</title>
    <script type="module" src="/src/trailer.ts"></script>
  </head>
  <body class="post-page trailer-page">
    <header class="post-header">
      <a class="brand" href="/" aria-label="Crops home">
        <img src="/crops.svg" alt="" width="34" height="34" />
        <span>crops<span class="brand-period">.</span></span>
      </a>
      <a class="button post-cta" href="/">Try Crops free</a>
    </header>
    <main class="trailer">
      <div class="trailer-intro">
        <p class="eyebrow">Launch trailer</p>
        <h1>Nah, I can tend to my own Crops.</h1>
      </div>
      <div class="trailer-frame">
        <video
          controls
          playsinline
          preload="metadata"
          poster="/trailer/poster.jpg"
          width="1920"
          height="1080"
        >
          <source src="/trailer/crops-launch.mp4" type="video/mp4" />
          Your browser can’t play this video.
          <a href="/trailer/crops-launch.mp4">Download the trailer</a>.
        </video>
      </div>
      <div class="trailer-actions">
        <a class="button primary" href="/">Start tracking free</a>
        <a class="button" href="/blog/the-harvest-has-gone-bad/"
          >Why we left Harvest</a
        >
      </div>
    </main>
  </body>
</html>
