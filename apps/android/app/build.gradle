plugins { id 'com.android.application' }

android {
    namespace 'com.crops.time'
    compileSdk 36
    defaultConfig {
        applicationId 'com.crops.time'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
        testInstrumentationRunner 'com.crops.time.CropsInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
}
